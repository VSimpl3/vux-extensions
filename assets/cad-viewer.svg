<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="bgGradCad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#0891b2" />
        </linearGradient>
    </defs>
    <!-- Full Circle Background -->
    <circle cx="32" cy="32" r="32" fill="url(#bgGradCad)" />
    <!-- Minimalist Drafting Compass & CAD Geometry -->
    <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Compass Pivot Head -->
        <circle cx="12" cy="4" r="1.5" fill="white" />
        <path d="M12 2v2" />
        
        <!-- Compass Legs -->
        <path d="M11 5.5L4 21" />
        <path d="M13 5.5L20 21" />
        
        <!-- Measurement Arc -->
        <path d="M7.5 14a8 8 0 0 1 9 0" stroke-width="1.5" stroke-dasharray="2 1.5" />
        
        <!-- Center Adjustment Axis Point -->
        <circle cx="12" cy="13.5" r="1" fill="white" />
    </g>
</svg>
